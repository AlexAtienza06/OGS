<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 13 - DOM básico y atributos XHTML</title>

        <script type="text/javascript">
             function anade() {
                var lista = document.getElementById("lista");

                var nuevoElemento = document.createElement("li");

                var texto = document.createTextNode("Nuevo elemento de la lista");

                nuevoElemento.appendChild(texto);

                lista.appendChild(nuevoElemento);
            }
        </script>
    </head>

    <body>

        <ul id="lista">
            <li>Lorem ipsum dolor sit amet</li>
            <li>Consectetuer adipiscing elit</li>
            <li>Sed mattis enim vitae orci</li>
            <li>Phasellus libero</li>
            <li>Maecenas nisl arcu</li>
        </ul>

        <input type="button" id="btAnade" value="Añadir elemento" onclick="anade()">

    </body>
</html>
